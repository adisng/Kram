name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64
        run: swift build -c release --arch arm64
      - name: Build x86_64
        run: swift build -c release --arch x86_64
      - name: Create universal archive
        run: |
          mkdir -p dist
          lipo -create \
            .build/arm64-apple-macosx/release/kram \
            .build/x86_64-apple-macosx/release/kram \
            -output dist/kram
          tar -czf "dist/kram-${GITHUB_REF_NAME}-macos-universal.tar.gz" -C dist kram
          shasum -a 256 "dist/kram-${GITHUB_REF_NAME}-macos-universal.tar.gz" > "dist/kram-${GITHUB_REF_NAME}-macos-universal.tar.gz.sha256"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
